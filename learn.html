<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learn Chords | Guitar Practice Trainer</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/learn.css">

</head>

<body>

    <nav>

        <div class="logo">
            🎸 Guitar Practice Trainer
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="learn.html" class="active">Learn Chords</a>
            <a href="practice.html">Practice</a>
        </div>

    </nav>

    <main class="container">

        <h1>Choose the Chords You Already Know</h1>

        <p class="subtitle">

            Only select the chords you can comfortably play.
            These chords will be used during practice.

        </p>

        <div class="top-controls">

            <input
                type="text"
                id="search"
                placeholder="Search chords...">

            <select id="filter">

                <option value="all">All Chords</option>
                <option value="major">Major</option>
                <option value="minor">Minor</option>
                <option value="7th">7th</option>

            </select>

        </div>

        <div id="selectedCounter">

            Selected Chords :
            <span id="count">0</span>

        </div>

        <div id="chordGrid" class="grid">

            <!-- Generated by JavaScript -->

        </div>

        <div class="bottomButtons">

            <button id="clearBtn">

                Clear Selection

            </button>

            <button id="practiceBtn">

                Start Practice →

            </button>

        </div>

    </main>

<script src="js/chords.js"></script>

</body>

</html>
